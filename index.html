<!DOCTYPE html>
<html>
<head>
  <title>VUS Hub</title>
  <style>
    body {
      font-family: system-ui, sans-serif; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      height: 100vh; 
      margin: 0; 
      background: #000000;
      color: #ffffff;
    }
    main {
      width: min(460px, calc(100% - 32px));
      text-align: center;
    }
    #hub {
      display: inline-block;
      padding: 15px 32px;
      font-size: 18px;
      font-weight: bold;
      background: #00cc66;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      text-decoration: none;
    }
    #hub:hover { background: #00994d; }
    #fallback {
      display: block;
      margin-top: 16px;
      color: #8ee6b8;
    }
    #status {
      min-height: 1.5em;
      color: #bbbbbb;
    }
  </style>
</head>
<body>
  <main>
    <button id="hub" type="button">Open VUS Hub</button>
    <p id="status">Click the button to open the current deployed hub.</p>
    <a id="fallback" href="https://cra-z-gaming.github.io/VUS/" target="_blank" rel="noopener">
      Use the GitHub Pages mirror
    </a>
  </main>

  <script>
    const hub = document.getElementById("hub");
    const status = document.getElementById("status");
    const HUB_URL = "https://vus-orcin.vercel.app/";
    const FALLBACK_URL = "https://cra-z-gaming.github.io/VUS/";

    hub.addEventListener("click", () => {
      const win = window.open("about:blank", "_blank");
      if (!win) {
        status.textContent = "Popup blocked. Allow popups for this launcher, then try again.";
        return;
      }

      win.opener = null;
      win.location.replace(HUB_URL);
      status.textContent = "Opening the deployed hub in a new tab.";
    });

    document.getElementById("fallback").href = FALLBACK_URL;
  </script>
</body>
</html>
